# The single source of lesson order for the site and the chat.
# Tracks appear in this order; each module lists lesson slugs in reading order.
# Every file under content/lessons/<track>/ must be listed exactly once here.
tracks:
  - id: ml-foundations
    title: ML Foundations
    tagline: The classical machine learning you need before working with LLMs.
    modules:
      - title: Classical ML
        lessons:
          - ml-workflow-train-test-split
          - linear-and-logistic-regression
          - decision-trees-and-random-forests
          - svm-and-kernels
          - gradient-boosting-xgboost
          - clustering-kmeans-dbscan
      - title: Practice
        lessons:
          - feature-engineering
          - model-evaluation-and-metrics
          - sklearn-ml-pipeline

  - id: ai-engineering
    title: AI Engineering
    tagline: Build apps on top of LLMs, from prompts and RAG to agents and evals.
    modules:
      - title: LLM basics
        lessons:
          - ai-app-mental-model
          - tokenization-and-context-windows
          - prompt-engineering-patterns
          - understanding-hallucinations
      - title: Retrieval & RAG
        lessons:
          - what-is-rag
          - embeddings-explained
          - faiss-basics
          - vector-databases-beyond-faiss
          - embedding-model-selection
          - chunking-strategies
          - hybrid-search-bm25-vector
          - reranking-with-cross-encoders
          - build-a-rag-pipeline
          - confidence-gates
      - title: Evaluation
        lessons:
          - evaluating-an-ai-app
          - building-an-eval-harness
          - hallucination-detection-llm-judge
      - title: Agents
        lessons:
          - what-is-an-agent
          - the-react-loop
          - designing-a-tool-registry
          - mcp-tool-use
          - agent-memory
          - reflection-and-self-correction
          - error-handling-in-agents
          - building-retrieval-tools-for-agents
      - title: Safety & security
        lessons:
          - safety-guardrails
          - prompt-injection-defense
          - pii-redaction-and-sanitization
          - rbac-for-rag
          - audit-logging-for-compliance
      - title: Data & fine-tuning
        lessons:
          - building-a-rag-dataset-pipeline
          - ingesting-public-corpora
          - relevance-filtering-corpus
          - deduplicating-datasets
          - quality-filtering-datasets
          - schema-validation-for-ai-data
          - train-val-test-splitting
          - synthesizing-training-data
          - formatting-data-for-sft
          - lora-fine-tuning
          - publishing-models-to-hub
      - title: Production
        lessons:
          - cost-and-latency
          - observability
          - capstone-ship-rag
      - title: Interview prep
        lessons:
          - explain-rag-in-interview
          - interviewer-questions-ai
          - defend-eval-metrics
          - resume-bullets-ai
          - explain-an-agent-architecture
          - interviewer-questions-on-agents
          - system-design-enterprise-rag
          - resume-bullets-agentic-projects

  - id: ai-systems
    title: AI Systems & MLOps
    tagline: Serve, scale and operate models and AI services in production.
    modules:
