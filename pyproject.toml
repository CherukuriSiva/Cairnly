[project]
name = "cairnly"
version = "0.1.0"
license = "MIT"
description = "A deployable AI knowledge assistant: point it at your docs, get cited answers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langfuse>=3.9,<4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cairnly = "cairnly.cli:main"

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=5",
    "torch>=2.4",
]
# Voice mode (src/cairnly/voice): the Pipecat framework, its WebSocket and WebRTC transports and
# the Silero VAD (ONNX, bundled). No speech models: tests run it with fakes.
voice = [
    "pipecat-ai[silero,webrtc,websocket]==1.15.0",
]
# The speech models the voice server runs: Whisper (faster-whisper) and Kokoro (ONNX).
voice-models = [
    "faster-whisper==1.2.1",
    "pipecat-ai[kokoro]==1.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
# The voice benchmark (evals/voice_bench.py): word error rate, Parakeet (ONNX) and Piper.
voice-bench = [
    "jiwer==4.0.0",
    "onnx-asr[cpu,hub]==0.12.0",
    "piper-tts==1.8.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cairnly"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the Postgres container (docker compose up -d db)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The reranker needs PyTorch. On Linux (Docker, CI) use the CPU-only build: the default
# wheel bundles ~3 GB of CUDA libraries that a CPU container never uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
