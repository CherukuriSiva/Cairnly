# Knowledge bases. Each one is a separate corpus with its own answer settings, the way a
# deployment would give each customer (or each team) its own docs and policy.
#
#   path       what `cairnly ingest --kb <name>` reads (a folder of .md/.mdx, or a .jsonl file)
#   min_score  confidence gate: refuse when the best cosine similarity is below this.
#              It is measured, not guessed: `cairnly eval` reports false refusals vs.
#              false accepts (off-topic questions, evals/off-topic.jsonl); see docs/LEARN-M3.md
#   prompt     prompt version from prompts/ (versioned so evals can compare them)
#   notice     shown with every answer in the UI
#   rerank     re-order candidates with a cross-encoder (measured lift; see src/cairnly/rerank.py)
#   questions  folder of written eval questions (one .jsonl per track) that `cairnly eval` adds
#              to the quiz questions; see docs/adr/0016-written-eval-set.md

lessons:
  title: AI engineering lessons
  path: content
  min_score: 0.70
  prompt: answer-learner-v1
  rerank: true
  questions: evals/questions
