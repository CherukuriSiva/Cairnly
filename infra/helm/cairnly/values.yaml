# Defaults run the whole stack inside the cluster (good for kind). For production use
# values-production.yaml: a managed Postgres, the models on the Modal GPU, no in-cluster
# Ollama. The Claude API is local development only and has no setting here.

image:
  api: cairnly-api:local
  web: cairnly-web:local
  pullPolicy: IfNotPresent

api:
  replicas: 1
  environment: development       # "production" makes the API refuse to enable the Claude API
  trustProxy: "0"                # "1" behind the ingress: rate limits use the last X-Forwarded-For
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

web:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

ollama:
  enabled: true                  # in-cluster embeddings (CPU is enough for nomic-embed-text)
  image: ollama/ollama:0.11.2
  models: [nomic-embed-text]     # pulled at start; add qwen3:8b for local chat (5 GB, slow on CPU)
  externalUrl: ""                # used instead when enabled=false (the Modal URL in production)
  proxyTokenSecret: ""           # secret with keys token_id/token_secret: Modal proxy auth
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 3Gi }

database:
  host: ""                       # empty = the in-cluster postgres below
  port: 5432
  name: cairnly
  user: cairnly
  sslmode: disable               # "require" for RDS
  existingSecret: ""             # secret with key "password"; otherwise secrets.dbPassword

postgres:
  enabled: true
  image: pgvector/pgvector:pg17
  storage: 5Gi

secrets:
  dbPassword: cairnly-local      # local default only; use existingSecret in real clusters

langfuse:
  host: ""                       # empty = tracing off
  existingSecret: ""             # secret with keys public_key/secret_key

ingest:
  enabled: true                  # migrate + ingest the lessons after every install/upgrade
  kb: lessons

ingress:
  enabled: false
  className: ""
  host: cairnly.local
  # /ask streams Server-Sent Events and can stay silent for minutes while the Modal GPU wakes
  # up (see infra/terraform/alb.tf). For ingress-nginx: no buffering, and long read timeouts.
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "400"
