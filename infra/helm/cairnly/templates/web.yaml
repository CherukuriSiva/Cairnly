apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "cairnly.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-web }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-web }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: web
          image: {{ .Values.image.web }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 3010, name: http }]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "cairnly.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-web }
  ports: [{ port: 3010, targetPort: http, name: http }]
