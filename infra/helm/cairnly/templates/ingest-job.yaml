{{- if .Values.ingest.enabled }}
# Runs after every install/upgrade: create tables, then re-ingest (only changed files are
# re-embedded). Waits for the database and Ollama instead of failing on a cold start.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-ingest-{{ .Release.Revision }}
  labels: {{- include "cairnly.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true }
      containers:
        - name: ingest
          image: {{ .Values.image.api }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c", "cairnly migrate && cairnly ingest --kb {{ .Values.ingest.kb }}"]
          env: {{- include "cairnly.apiEnv" . | nindent 12 }}
{{- end }}
