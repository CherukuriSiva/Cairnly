{{- if .Values.ingress.enabled }}
# Same origin for UI and API: API paths go to the api service, everything else to the web UI.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "cairnly.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range list "/ask" "/search" "/kbs" "/health" "/livez" "/config" }}
          - path: {{ . }}
            pathType: Prefix
            backend: { service: { name: {{ $.Release.Name }}-api, port: { name: http } } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-web, port: { name: http } } }
{{- end }}
