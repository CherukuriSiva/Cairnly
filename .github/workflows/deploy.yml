name: deploy

# Manual on purpose: a deploy is a decision. Run it from the Actions tab once CI is green.
# Needs (set once, see infra/terraform/README.md):
#   repository variables  AWS_REGION, TF_STATE_BUCKET
#   repository secret     AWS_DEPLOY_ROLE_ARN   (from infra/bootstrap; no AWS keys stored)
on:
  workflow_dispatch:

permissions:
  id-token: write # lets GitHub prove its identity to AWS (OIDC)
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt a half-finished apply

env:
  TF_DIR: infra/terraform
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"

      # First run: the image registries must exist before images can be pushed.
      - name: Ensure registries
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve -var region=${{ vars.AWS_REGION }} -target=aws_ecr_repository.app -target=aws_ecr_lifecycle_policy.app

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        run: |
          API=${{ steps.ecr.outputs.registry }}/cairnly-api:$IMAGE_TAG
          WEB=${{ steps.ecr.outputs.registry }}/cairnly-web:$IMAGE_TAG
          docker build -t "$API" .
          docker build -t "$WEB" --build-arg NEXT_PUBLIC_API_URL= web   # same origin via the load balancer
          docker push "$API"
          docker push "$WEB"

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve -var region=${{ vars.AWS_REGION }} -var image_tag="$IMAGE_TAG"

      - name: Wait for the services to be stable
        run: aws ecs wait services-stable --cluster cairnly --services api web ollama

      - name: Migrate and ingest
        working-directory: ${{ env.TF_DIR }}
        run: |
          TASK=$(eval "$(terraform output -raw run_ingest)" --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster cairnly --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster cairnly --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "ingest exit code: $CODE"
          test "$CODE" = "0"

      - name: Smoke test
        working-directory: ${{ env.TF_DIR }}
        run: |
          URL=$(terraform output -raw url)
          curl -fsS "$URL/health"
          curl -fsS "$URL/" -o /dev/null
          echo "deployed: $URL"
